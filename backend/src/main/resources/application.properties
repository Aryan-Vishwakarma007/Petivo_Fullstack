server.port=8080
spring.application.name=petivo-api

# MySQL datasource credentials are required through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petivo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Supply a unique secret of at least 32 bytes via JWT_SECRET.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# The frontend uses same-origin requests in Docker. These origins support Vite development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
