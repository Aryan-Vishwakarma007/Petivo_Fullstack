server.port=8080
spring.application.name=petivo-api-test

# Use H2 in-memory database with MySQL compatibility mode for tests
spring.datasource.url=jdbc:h2:mem:petivotestdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

jwt.secret=petivo-test-only-secret-for-integration-tests-2026
jwt.expiration=86400000
petivo.bootstrap.admin-email=
petivo.bootstrap.admin-password=
